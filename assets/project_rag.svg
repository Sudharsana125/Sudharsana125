<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <linearGradient id="cardBorderRag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="glowIndigo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="316" height="356" rx="14" fill="url(#cardBg)" stroke="url(#cardBorderRag)" stroke-width="1.5" />

  <!-- Top Controls -->
  <!-- 03 Badge -->
  <rect x="18" y="16" width="34" height="22" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <text x="35" y="31" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle" class="mono">03</text>

  <!-- Arrow Circle Icon -->
  <circle cx="286" cy="27" r="13" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <path d="M282 31L290 23M290 23H284M290 23V29" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- RAG Vector DB & Documents Illustration -->
  <g transform="translate(160, 105)">
    <!-- Ambient Aura -->
    <ellipse cx="0" cy="15" rx="55" ry="25" fill="#6366f1" fill-opacity="0.18" filter="url(#glowIndigo)" />

    <!-- Left: Layered Document Sheets -->
    <g transform="translate(-46, -26)">
      <!-- Back Doc -->
      <rect x="0" y="0" width="32" height="42" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <!-- Middle Doc -->
      <rect x="8" y="6" width="32" height="42" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="0.8" />
      <!-- Front Doc -->
      <rect x="16" y="12" width="32" height="42" rx="4" fill="#0b1329" stroke="#60a5fa" stroke-width="1" />
      <!-- Lines inside front doc -->
      <line x1="21" y1="20" x2="38" y2="20" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" />
      <line x1="21" y1="25" x2="43" y2="25" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round" />
      <line x1="21" y1="30" x2="36" y2="30" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round" />
      <line x1="21" y1="35" x2="41" y2="35" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round" />
      <line x1="21" y1="40" x2="30" y2="40" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Right: 3D Vector Database Cylinder Stack -->
    <g transform="translate(24, -14)">
      <!-- Cylinder 1 (Top) -->
      <g transform="translate(0, 0)">
        <path d="M0 8 C0 13 32 13 32 8 L32 18 C32 23 0 23 0 18 Z" fill="url(#dbGrad)" />
        <ellipse cx="16" cy="8" rx="16" ry="6" fill="#60a5fa" stroke="#93c5fd" stroke-width="0.8" />
        <ellipse cx="16" cy="18" rx="16" ry="6" fill="none" stroke="#2563eb" stroke-width="0.8" />
      </g>

      <!-- Cylinder 2 (Middle) -->
      <g transform="translate(0, 14)">
        <path d="M0 8 C0 13 32 13 32 8 L32 18 C32 23 0 23 0 18 Z" fill="url(#dbGrad)" />
        <ellipse cx="16" cy="18" rx="16" ry="6" fill="none" stroke="#2563eb" stroke-width="0.8" />
      </g>

      <!-- Cylinder 3 (Bottom) -->
      <g transform="translate(0, 28)">
        <path d="M0 8 C0 13 32 13 32 8 L32 18 C32 23 0 23 0 18 Z" fill="url(#dbGrad)" />
        <ellipse cx="16" cy="18" rx="16" ry="6" fill="none" stroke="#2563eb" stroke-width="0.8" />
      </g>
    </g>

    <!-- Center Bridge: Glowing Neural Query Pipe & RAG Badge -->
    <g transform="translate(-10, 10)">
      <!-- Connecting Data Flow Stream -->
      <path d="M-6 8 C6 -2, 14 -2, 26 8" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 2" />
      
      <!-- Glowing RAG Box Badge -->
      <rect x="-14" y="-2" width="38" height="22" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#glowIndigo)" />
      <rect x="-14" y="-2" width="38" height="22" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="5" y="13" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle" class="mono">RAG</text>
    </g>
  </g>

  <!-- Title -->
  <text x="20" y="196" font-size="18" font-weight="800" fill="#ffffff" class="sans">Intelligent RAG System</text>

  <!-- Description -->
  <text x="20" y="222" font-size="12" fill="#94a3b8" class="sans">Domain-aware RAG system for accurate,</text>
  <text x="20" y="240" font-size="12" fill="#94a3b8" class="sans">context-rich answers using LLMs and</text>
  <text x="20" y="258" font-size="12" fill="#94a3b8" class="sans">intelligent retrieval pipelines.</text>

  <!-- Tags Row -->
  <g transform="translate(18, 304)">
    <!-- Python -->
    <rect x="0" y="0" width="58" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="29" y="17" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle" class="sans">Python</text>

    <!-- LLMs -->
    <rect x="64" y="0" width="48" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="88" y="17" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle" class="sans">LLMs</text>

    <!-- RAG -->
    <rect x="118" y="0" width="44" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="140" y="17" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle" class="sans">RAG</text>

    <!-- LangChain -->
    <rect x="168" y="0" width="80" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="208" y="17" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle" class="sans">LangChain</text>
  </g>
</svg>
