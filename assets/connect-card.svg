<svg width="100%" height="90" viewBox="0 0 860 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="connect-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="link-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.5" />
    </linearGradient>

    <filter id="glow-link" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .link-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        fill: #FFFFFF;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <rect x="6" y="6" width="848" height="78" rx="14" fill="#060608" stroke="url(#connect-border)" stroke-width="1.3" />

  <!-- GitHub -->
  <g transform="translate(60, 24)">
    <rect width="150" height="42" rx="21" fill="#111216" stroke="url(#link-border)" stroke-width="1.2" filter="url(#glow-link)" />
    <circle cx="28" cy="21" r="5" fill="#FFFFFF" />
    <text x="86" y="26" text-anchor="middle" class="link-text">GitHub</text>
  </g>

  <!-- LinkedIn -->
  <g transform="translate(245, 24)">
    <rect width="155" height="42" rx="21" fill="#111216" stroke="url(#link-border)" stroke-width="1.2" filter="url(#glow-link)" />
    <circle cx="28" cy="21" r="5" fill="#FFFFFF" />
    <text x="88" y="26" text-anchor="middle" class="link-text">LinkedIn</text>
  </g>

  <!-- Portfolio -->
  <g transform="translate(435, 24)">
    <rect width="165" height="42" rx="21" fill="#111216" stroke="url(#link-border)" stroke-width="1.2" filter="url(#glow-link)" />
    <circle cx="28" cy="21" r="5" fill="#FFFFFF" />
    <text x="94" y="26" text-anchor="middle" class="link-text">Portfolio</text>
  </g>

  <!-- Email -->
  <g transform="translate(635, 24)">
    <rect width="165" height="42" rx="21" fill="#111216" stroke="url(#link-border)" stroke-width="1.2" filter="url(#glow-link)" />
    <circle cx="28" cy="21" r="5" fill="#FFFFFF" />
    <text x="94" y="26" text-anchor="middle" class="link-text">Email Me</text>
  </g>
</svg>
