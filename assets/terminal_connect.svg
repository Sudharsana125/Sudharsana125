<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 470 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardTermBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d1c" />
      <stop offset="50%" stop-color="#0b1226" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <!-- Border Gradient (Exact match to current_focus) -->
    <linearGradient id="cardTermBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Inner Terminal Screen Background -->
    <linearGradient id="termScreenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- Button Gradients -->
    <linearGradient id="btnLinkedIn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1f42" />
      <stop offset="100%" stop-color="#071228" />
    </linearGradient>

    <linearGradient id="btnGitHub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161c2d" />
      <stop offset="100%" stop-color="#0e1320" />
    </linearGradient>

    <linearGradient id="btnEmail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082b36" />
      <stop offset="100%" stop-color="#04181f" />
    </linearGradient>

    <filter id="cyanNeonMini" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .clickable { cursor: pointer; transition: transform 0.2s ease; }
    .clickable:hover { transform: translateY(-2px); }
  </style>

  <!-- Outer Card Frame (Exact Match to Current Focus Card) -->
  <rect x="2" y="2" width="466" height="376" rx="16" fill="url(#cardTermBg)" stroke="url(#cardTermBorder)" stroke-width="1.6" />

  <!-- Top Terminal Window Frame -->
  <g transform="translate(18, 16)">
    <!-- Terminal Screen Box -->
    <rect x="0" y="0" width="434" height="236" rx="12" fill="url(#termScreenBg)" stroke="#1e293b" stroke-width="1" />

    <!-- Title Bar with Mac/Linux Control Dots -->
    <rect x="0" y="0" width="434" height="34" rx="12" fill="#0b1120" />
    <path d="M0 24 L434 24" stroke="#1e293b" stroke-width="1" />

    <circle cx="18" cy="17" r="5" fill="#ef4444" />
    <circle cx="34" cy="17" r="5" fill="#f59e0b" />
    <circle cx="50" cy="17" r="5" fill="#10b981" />

    <text x="217" y="21" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" class="mono">sudharsana@autonomous-node:~$</text>

    <!-- Terminal Prompt Lines -->
    <g transform="translate(18, 54)" font-size="12" class="mono">
      <!-- Line 1: whoami -->
      <text x="0" y="0" fill="#a855f7" font-weight="700">$</text>
      <text x="14" y="0" fill="#e2e8f0" font-weight="600">whoami</text>
      <text x="110" y="0" fill="#64748b">→</text>
      <text x="130" y="0" fill="#f8fafc" font-weight="700">Sudharsana K</text>
      <text x="230" y="0" fill="#38bdf8" font-size="11">[AI/ML Engineer]</text>

      <!-- Line 2: domain -->
      <text x="0" y="26" fill="#a855f7" font-weight="700">$</text>
      <text x="14" y="26" fill="#e2e8f0" font-weight="600">focus</text>
      <text x="110" y="26" fill="#64748b">→</text>
      <text x="130" y="26" fill="#00f0ff" font-weight="600">Autonomous Agent Swarms</text>

      <!-- Line 3: architecture -->
      <text x="0" y="52" fill="#a855f7" font-weight="700">$</text>
      <text x="14" y="52" fill="#e2e8f0" font-weight="600">stack</text>
      <text x="110" y="52" fill="#64748b">→</text>
      <text x="130" y="52" fill="#cbd5e1"><tspan fill="#c084fc">CrewAI</tspan> • <tspan fill="#38bdf8">LangGraph</tspan> • <tspan fill="#34d399">Gemini</tspan></text>

      <!-- Line 4: mission -->
      <text x="0" y="78" fill="#a855f7" font-weight="700">$</text>
      <text x="14" y="78" fill="#e2e8f0" font-weight="600">mission</text>
      <text x="110" y="78" fill="#64748b">→</text>
      <text x="130" y="78" fill="#94a3b8">Ideas ➔ Agents ➔ Real Impact</text>

      <!-- Line 5: status -->
      <text x="0" y="104" fill="#a855f7" font-weight="700">$</text>
      <text x="14" y="104" fill="#e2e8f0" font-weight="600">status</text>
      <text x="110" y="104" fill="#64748b">→</text>
      <text x="130" y="104" fill="#34d399" font-weight="700">Open for High-Impact Roles</text>

      <!-- Cursor Blink -->
      <rect x="0" y="122" width="8" height="15" fill="#00f0ff" />
      <text x="16" y="135" fill="#64748b" font-size="11">ready for input_</text>
    </g>
  </g>

  <!-- BOTTOM SECTION: CONNECT DOCK -->
  <g transform="translate(18, 268)">
    <!-- Header Title -->
    <g transform="translate(4, 0)">
      <path d="M0 6 L10 0 L5 12 L3 8 Z" fill="#00f0ff" />
      <text x="18" y="5" font-size="13" font-weight="800" fill="#f8fafc" class="sans">Let's Connect &amp; Collaborate</text>
    </g>

    <!-- 3 Glowing Interactive Connect Buttons -->
    <g transform="translate(0, 18)">
      <!-- LinkedIn Button -->
      <a xlink:href="https://www.linkedin.com/in/sudharsanak" target="_blank" class="clickable">
        <rect x="0" y="0" width="138" height="66" rx="10" fill="url(#btnLinkedIn)" stroke="#2563eb" stroke-width="1.2" />
        <rect x="12" y="18" width="30" height="30" rx="6" fill="#0a66c2" />
        <text x="27" y="38" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" class="sans">in</text>
        <text x="50" y="32" font-size="12.5" font-weight="700" fill="#ffffff" class="sans">LinkedIn</text>
        <text x="50" y="48" font-size="9.5" fill="#93c5fd" class="sans">Connect ↗</text>
      </a>

      <!-- GitHub Button -->
      <a xlink:href="https://github.com/Sudharsana125" target="_blank" class="clickable">
        <rect x="148" y="0" width="138" height="66" rx="10" fill="url(#btnGitHub)" stroke="#475569" stroke-width="1.2" />
        <g transform="translate(160, 18)">
          <rect x="0" y="0" width="30" height="30" rx="6" fill="#1e293b" />
          <g transform="translate(6, 6) scale(0.75)">
            <path fill="#ffffff" fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" />
          </g>
        </g>
        <text x="198" y="32" font-size="12.5" font-weight="700" fill="#ffffff" class="sans">GitHub</text>
        <text x="198" y="48" font-size="9.5" fill="#94a3b8" class="sans">Repositories ↗</text>
      </a>

      <!-- Email Button -->
      <a xlink:href="mailto:sudharsanak13@gmail.com" class="clickable">
        <rect x="296" y="0" width="138" height="66" rx="10" fill="url(#btnEmail)" stroke="#0e7490" stroke-width="1.2" />
        <g transform="translate(308, 18)">
          <rect x="0" y="0" width="30" height="30" rx="6" fill="#0c4a6e" />
          <rect x="5" y="8" width="20" height="14" rx="2" fill="none" stroke="#22d3ee" stroke-width="1.6" />
          <path d="M5 10 L15 17 L25 10" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <text x="346" y="32" font-size="12.5" font-weight="700" fill="#ffffff" class="sans">Email</text>
        <text x="346" y="48" font-size="9.5" fill="#67e8f9" class="sans">Get in Touch ↗</text>
      </a>
    </g>
  </g>
</svg>
