<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 45" width="100%" height="100%">
  <defs>
    <linearGradient id="footerTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glowFooter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Left: Progress dots and bar -->
  <g transform="translate(30, 22)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="35" y2="0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="75" cy="0" r="1.5" fill="#38bdf8" />
    <circle cx="85" cy="0" r="1.5" fill="#38bdf8" />
    <circle cx="95" cy="0" r="1.5" fill="#38bdf8" />
    <circle cx="105" cy="0" r="1.5" fill="#1e293b" />
    <circle cx="115" cy="0" r="1.5" fill="#1e293b" />
  </g>

  <!-- Center: Flow text -->
  <g transform="translate(500, 26)">
    <text x="0" y="0" font-size="12" font-weight="800" letter-spacing="3" fill="url(#footerTextGrad)" text-anchor="middle" filter="url(#glowFooter)" class="sans">
      IDEAS  ➔  AGENTS  ➔  IMPACT
    </text>
  </g>

  <!-- Right: Monospace tagline -->
  <g transform="translate(970, 26)">
    <text x="0" y="0" font-size="10.5" font-weight="600" letter-spacing="1" fill="#64748b" text-anchor="end" class="mono">
      &lt; A CURIOUS MIND FOR A BRIGHTER TOMORROW /&gt;
    </text>
  </g>
</svg>
