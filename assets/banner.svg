<svg width="100%" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Crisp Metallic Silver Chrome Gradient (Zero Blur, High Contrast) -->
    <linearGradient id="silver-chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Metallic Silver Border Gradient -->
    <linearGradient id="silver-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="20%" stop-color="#E2E8F0" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="80%" stop-color="#E2E8F0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3" />
    </linearGradient>

    <!-- Deep Pure Black Canvas -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="50%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <!-- Outer Border Glow Filter (For frame only) -->
    <filter id="frame-silver-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="corner-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clean, Crisp Matrix Grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>

    <style>
      @keyframes pulseBorder {
        0%, 100% {
          filter: drop-shadow(0 0 8px rgba(226, 232, 240, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.75));
        }
      }

      .glowing-frame {
        animation: pulseBorder 4s ease-in-out infinite;
      }

      .silver-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 7px;
        text-transform: uppercase;
        text-rendering: geometricPrecision;
      }

      .silver-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: uppercase;
        text-rendering: geometricPrecision;
      }
    </style>
  </defs>

  <!-- Outer Black Card (Solid clean pitch-black, NO blurry fog) -->
  <rect x="8" y="8" width="884" height="214" rx="16" fill="url(#bg-grad)" />
  <rect x="8" y="8" width="884" height="214" rx="16" fill="url(#grid)" />

  <!-- Silver Glowing Border (Only the border glows) -->
  <rect class="glowing-frame" x="8" y="8" width="884" height="214" rx="16" fill="none" stroke="url(#silver-border)" stroke-width="1.8" filter="url(#frame-silver-glow)" />

  <!-- Corner Accent Lines (Cyberpunk / Luxury Metallic touches) -->
  <path d="M 14 42 L 14 16 L 40 16" stroke="#FFFFFF" stroke-width="2.5" fill="none" filter="url(#corner-glow)" />
  <path d="M 886 42 L 886 16 L 860 16" stroke="#FFFFFF" stroke-width="2.5" fill="none" filter="url(#corner-glow)" />
  <path d="M 14 188 L 14 214 L 40 214" stroke="#FFFFFF" stroke-width="2.5" fill="none" filter="url(#corner-glow)" />
  <path d="M 886 188 L 886 214 L 860 214" stroke="#FFFFFF" stroke-width="2.5" fill="none" filter="url(#corner-glow)" />

  <!-- Center Content - 100% SHARP, RETINA VECTOR, ZERO BLUR -->
  <g id="header-text">
    <!-- Top Eyebrow -->
    <text x="450" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#94A3B8">
      ✦ WELCOME TO MY PROFILE ✦
    </text>

    <!-- Main Name Title - ULTRA CRISP & PIN-SHARP METALLIC CHROME -->
    <text class="silver-title" x="450" y="116" text-anchor="middle" font-size="38" fill="url(#silver-chrome)">
      SUDHARSANA K
    </text>

    <!-- Subtitle / Role -->
    <text class="silver-subtitle" x="450" y="152" text-anchor="middle" font-size="14" fill="#CBD5E1">
      AI &amp; AGENTIC AI DEVELOPER
    </text>
  </g>

  <!-- Bottom Silver Accent Line with diamond -->
  <path d="M 310 180 L 435 180 M 465 180 L 590 180" stroke="url(#silver-border)" stroke-width="1.4" />
  <polygon points="450,175 455,180 450,185 445,180" fill="#FFFFFF" filter="url(#corner-glow)" />
</svg>
