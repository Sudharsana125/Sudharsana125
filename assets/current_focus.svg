<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="100%" height="100%">
  <defs>
    <linearGradient id="focusBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#070b16" />
    </linearGradient>

    <linearGradient id="focusBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="itemBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#0b1324" />
    </linearGradient>

    <filter id="glowGreenDot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="356" height="326" rx="14" fill="url(#focusBg)" stroke="url(#focusBorder)" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(20, 28)">
    <circle cx="8" cy="-5" r="8" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="8" cy="-5" r="3" fill="#38bdf8" />
    <text x="26" y="0" font-size="16" font-weight="800" fill="#f8fafc" class="sans">Current Focus</text>

    <!-- Active Badge -->
    <g transform="translate(230, -14)">
      <rect x="0" y="0" width="80" height="22" rx="11" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#34d399" filter="url(#glowGreenDot)" />
      <text x="24" y="15" font-size="10" font-weight="800" fill="#34d399" letter-spacing="1" class="mono">ACTIVE</text>
    </g>
  </g>

  <!-- FOCUS ITEMS LIST -->

  <!-- Item 1: Learning -> APIs / System Design -->
  <g transform="translate(18, 54)">
    <rect x="0" y="0" width="324" height="52" rx="10" fill="url(#itemBg)" stroke="#1e293b" stroke-width="1" />
    <!-- Icon Box: Book (Purple) -->
    <rect x="10" y="9" width="34" height="34" rx="8" fill="#581c87" fill-opacity="0.3" stroke="#7e22ce" stroke-width="0.8" />
    <g transform="translate(19, 18)">
      <path d="M0 2 C4 0 8 0 8 16 C5 15 2 15 0 16 Z" fill="none" stroke="#c084fc" stroke-width="1.4" />
      <path d="M16 2 C12 0 8 0 8 16 C11 15 14 15 16 16 Z" fill="none" stroke="#c084fc" stroke-width="1.4" />
    </g>

    <!-- Label -->
    <text x="56" y="30" font-size="12" font-weight="700" fill="#ffffff" class="sans">Learning</text>
    <text x="120" y="30" font-size="12" fill="#64748b" class="sans">→</text>
    <text x="144" y="30" font-size="12" font-weight="600" fill="#cbd5e1" class="sans">APIs / System Design</text>
  </g>

  <!-- Item 2: Building -> Agentic AI Applications -->
  <g transform="translate(18, 118)">
    <rect x="0" y="0" width="324" height="52" rx="10" fill="url(#itemBg)" stroke="#1e293b" stroke-width="1" />
    <!-- Icon Box: Gear (Blue) -->
    <rect x="10" y="9" width="34" height="34" rx="8" fill="#1e3a8a" fill-opacity="0.3" stroke="#2563eb" stroke-width="0.8" />
    <g transform="translate(20, 19)">
      <circle cx="7" cy="7" r="4.5" fill="none" stroke="#60a5fa" stroke-width="1.6" />
      <circle cx="7" cy="7" r="2" fill="#60a5fa" />
    </g>

    <!-- Label -->
    <text x="56" y="30" font-size="12" font-weight="700" fill="#ffffff" class="sans">Building</text>
    <text x="120" y="30" font-size="12" fill="#64748b" class="sans">→</text>
    <text x="144" y="30" font-size="11.5" font-weight="600" fill="#cbd5e1" class="sans">Agentic AI Applications</text>
  </g>

  <!-- Item 3: Exploring -> LLMs / RAG -->
  <g transform="translate(18, 182)">
    <rect x="0" y="0" width="324" height="52" rx="10" fill="url(#itemBg)" stroke="#1e293b" stroke-width="1" />
    <!-- Icon Box: Magnifier (Cyan) -->
    <rect x="10" y="9" width="34" height="34" rx="8" fill="#0e7490" fill-opacity="0.3" stroke="#0891b2" stroke-width="0.8" />
    <g transform="translate(20, 19)">
      <circle cx="6" cy="6" r="4.5" fill="none" stroke="#22d3ee" stroke-width="1.6" />
      <line x1="9.5" y1="9.5" x2="14" y2="14" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Label -->
    <text x="56" y="30" font-size="12" font-weight="700" fill="#ffffff" class="sans">Exploring</text>
    <text x="120" y="30" font-size="12" fill="#64748b" class="sans">→</text>
    <text x="144" y="30" font-size="12" font-weight="600" fill="#cbd5e1" class="sans">LLMs / RAG</text>
  </g>

  <!-- Item 4: Improving -> Multi-Agent Systems -->
  <g transform="translate(18, 246)">
    <rect x="0" y="0" width="324" height="52" rx="10" fill="url(#itemBg)" stroke="#1e293b" stroke-width="1" />
    <!-- Icon Box: Chart (Green) -->
    <rect x="10" y="9" width="34" height="34" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#059669" stroke-width="0.8" />
    <g transform="translate(19, 18)">
      <line x1="2" y1="14" x2="14" y2="14" stroke="#34d399" stroke-width="1.4" stroke-linecap="round" />
      <line x1="4" y1="14" x2="4" y2="9" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" />
      <line x1="8" y1="14" x2="8" y2="5" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" />
      <line x1="12" y1="14" x2="12" y2="2" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Label -->
    <text x="56" y="30" font-size="12" font-weight="700" fill="#ffffff" class="sans">Improving</text>
    <text x="120" y="30" font-size="12" fill="#64748b" class="sans">→</text>
    <text x="144" y="30" font-size="11.5" font-weight="600" fill="#cbd5e1" class="sans">Multi-Agent Systems</text>
  </g>
</svg>
