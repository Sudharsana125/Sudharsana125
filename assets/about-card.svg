<svg width="100%" height="210" viewBox="0 0 920 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Silver Border Gradient -->
    <linearGradient id="about-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#334155" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#334155" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85" />
    </linearGradient>

    <!-- Deep Pitch-Black Canvas -->
    <linearGradient id="about-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080b" />
      <stop offset="50%" stop-color="#040406" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>

    <!-- Silver Soft Glow Filter -->
    <filter id="card-soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="quote-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .bio-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 13.5px;
        line-height: 1.65;
        fill: #CBD5E1;
        letter-spacing: 0.2px;
      }
      .bio-bold {
        font-weight: 700;
        fill: #FFFFFF;
      }
      .bio-highlight {
        font-weight: 600;
        fill: #F1F5F9;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="6" y="6" width="908" height="198" rx="14" fill="url(#about-bg)" stroke="url(#about-border)" stroke-width="1.4" filter="url(#card-soft-glow)" />

  <!-- Corner Precision Brackets -->
  <path d="M 14 30 L 14 14 L 30 14" stroke="#FFFFFF" stroke-width="1.8" fill="none" opacity="0.85" />
  <path d="M 906 30 L 906 14 L 890 14" stroke="#FFFFFF" stroke-width="1.8" fill="none" opacity="0.85" />
  <path d="M 14 180 L 14 196 L 30 196" stroke="#FFFFFF" stroke-width="1.8" fill="none" opacity="0.85" />
  <path d="M 906 180 L 906 196 L 890 196" stroke="#FFFFFF" stroke-width="1.8" fill="none" opacity="0.85" />

  <!-- Elegant Decorative Opening Quotation Mark -->
  <text x="36" y="44" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFFFFF" opacity="0.3" filter="url(#quote-glow)">“</text>

  <!-- Bio Narrative Text Block -->
  <g transform="translate(56, 42)">
    <!-- Line 1 -->
    <text x="0" y="0" class="bio-text">
      <tspan fill="#CBD5E1">I’m a </tspan>
      <tspan class="bio-bold">curious learner, passionate builder, and AI enthusiast</tspan>
      <tspan fill="#CBD5E1"> who believes that the best way</tspan>
    </text>

    <!-- Line 2 -->
    <text x="0" y="27" class="bio-text">
      <tspan fill="#CBD5E1">to understand technology is to </tspan>
      <tspan class="bio-bold">build with it.</tspan>
      <tspan fill="#CBD5E1"> I enjoy turning ideas into real-world projects and exploring technologies like</tspan>
    </text>

    <!-- Line 3 -->
    <text x="0" y="54" class="bio-text">
      <tspan class="bio-highlight">Generative AI, Agentic AI, RAG, LLMs, LangChain, CrewAI, Python,</tspan>
      <tspan fill="#CBD5E1"> and </tspan>
      <tspan class="bio-highlight">AI Automation.</tspan>
    </text>

    <!-- Line 4 -->
    <text x="0" y="81" class="bio-text">
      <tspan fill="#CBD5E1">I love experimenting with new concepts, solving problems, and pushing myself beyond what I already know.</tspan>
    </text>

    <!-- Line 5 -->
    <text x="0" y="108" class="bio-text">
      <tspan fill="#CBD5E1">Every project is a new challenge, every challenge is a new lesson — and that’s what keeps me </tspan>
      <tspan class="bio-bold">building, learning, and evolving. 🚀</tspan>
    </text>
  </g>
</svg>
