<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Executive Slate / Obsidian Gradient -->
    <linearGradient id="proBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#070b16" />
    </linearGradient>

    <!-- Refined Azure Border -->
    <linearGradient id="proBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Metallic Titanium Name Gradient -->
    <linearGradient id="titaniumText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Subtle Clean Blue Glow Filter -->
    <filter id="subtleBlueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softBacklight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- Clean Tech Dot Grid -->
    <pattern id="cleanGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.65" fill="#334155" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="996" height="296" rx="14" fill="url(#proBg)" stroke="url(#proBorder)" stroke-width="1.5" />
  <rect x="2" y="2" width="996" height="296" rx="14" fill="url(#cleanGrid)" />

  <!-- Soft Azure Ambient Glow -->
  <circle cx="200" cy="150" r="140" fill="#1d4ed8" fill-opacity="0.12" filter="url(#softBacklight)" />
  <circle cx="820" cy="150" r="130" fill="#0284c7" fill-opacity="0.12" filter="url(#softBacklight)" />

  <!-- Top Terminal Bar -->
  <g transform="translate(36, 32)">
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
    <text x="12" y="4" font-size="12" font-weight="700" fill="#38bdf8" class="mono">sudharsana.ai</text>
    <text x="120" y="4" font-size="12" fill="#475569" class="mono">/</text>
    <text x="135" y="4" font-size="11.5" font-weight="500" fill="#94a3b8" class="mono">autonomous-systems</text>

    <!-- Right Live Pill -->
    <g transform="translate(730, -9)">
      <rect x="0" y="0" width="198" height="24" rx="12" fill="#061826" stroke="#0284c7" stroke-width="1" />
      <circle cx="14" cy="12" r="3.5" fill="#38bdf8" />
      <text x="26" y="16" font-size="10.5" font-weight="700" fill="#7dd3fc" letter-spacing="1" class="mono">AVAILABLE FOR IMPACT</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="50" x2="964" y2="50" stroke="#1e293b" stroke-width="1" />

  <!-- LEFT HERO INFO (Minimalist & Professional) -->
  <g transform="translate(40, 105)">
    <!-- Role Subtitle Badge -->
    <text x="0" y="0" font-size="12" font-weight="800" letter-spacing="3" fill="#38bdf8" class="mono">AI &amp; AGENTIC SYSTEMS ENGINEER</text>

    <!-- Main Clean Typography -->
    <text x="0" y="46" font-size="50" font-weight="900" letter-spacing="1.5" fill="url(#titaniumText)" class="sans">
      SUDHARSANA <tspan fill="#38bdf8">K</tspan>
    </text>

    <!-- One-Line Professional Tagline -->
    <text x="0" y="80" font-size="14" font-weight="500" fill="#94a3b8" class="sans">
      Architecting autonomous multi-agent swarms, hybrid RAG pipelines, and resilient telemetry.
    </text>

    <!-- 3 Clean Minimal Badges -->
    <g transform="translate(0, 110)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="145" height="32" rx="6" fill="#0c162c" stroke="#1e3a8a" stroke-width="1" />
      <text x="72" y="20" font-size="11.5" font-weight="600" fill="#e2e8f0" text-anchor="middle" class="sans">Multi-Agent Swarms</text>

      <!-- Badge 2 -->
      <rect x="155" y="0" width="125" height="32" rx="6" fill="#0c162c" stroke="#1e3a8a" stroke-width="1" />
      <text x="217" y="20" font-size="11.5" font-weight="600" fill="#e2e8f0" text-anchor="middle" class="sans">Production RAG</text>

      <!-- Badge 3 -->
      <rect x="290" y="0" width="145" height="32" rx="6" fill="#0c162c" stroke="#1e3a8a" stroke-width="1" />
      <text x="362" y="20" font-size="11.5" font-weight="600" fill="#e2e8f0" text-anchor="middle" class="sans">IoT Crisis Telemetry</text>
    </g>
  </g>

  <!-- RIGHT 3D MINIMALIST ARCHITECTURAL GRAPHIC (Clean Blue & Slate) -->
  <g transform="translate(780, 165)">
    <!-- Outer Orbit Ring -->
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4 3" opacity="0.7" />

    <!-- Isometric Central Tech Core -->
    <g transform="translate(0, -10)">
      <!-- Ground Platform -->
      <polygon points="0,-35 90,10 0,55 -90,10" fill="#0c1833" stroke="#0284c7" stroke-width="1.5" />
      <polygon points="-90,10 0,55 0,63 -90,18" fill="#071b3d" />
      <polygon points="0,55 90,10 90,18 0,63" fill="#0b2450" />

      <!-- Center Floating Crystal Core -->
      <polygon points="0,-48 24,-24 0,0 -24,-24" fill="#0284c7" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
      <polygon points="-24,-24 0,0 0,32 -24,8" fill="#1e40af" stroke="#38bdf8" stroke-width="1.2" />
      <polygon points="0,0 24,-24 24,8 0,32" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2" />

      <!-- Core Light Pulse -->
      <circle cx="0" cy="-6" r="4" fill="#ffffff" filter="url(#subtleBlueGlow)" />
    </g>

    <!-- Satellite Agent Node Left -->
    <g transform="translate(-105, -15)">
      <circle cx="0" cy="0" r="14" fill="#08142b" stroke="#38bdf8" stroke-width="1.4" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      <line x1="0" y1="0" x2="80" y2="10" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="2 2" />
      <text x="0" y="24" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle" class="mono">AGENTS</text>
    </g>

    <!-- Satellite Agent Node Right -->
    <g transform="translate(105, -15)">
      <circle cx="0" cy="0" r="14" fill="#08142b" stroke="#38bdf8" stroke-width="1.4" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      <line x1="0" y1="0" x2="-80" y2="10" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="2 2" />
      <text x="0" y="24" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle" class="mono">TELEMETRY</text>
    </g>

    <!-- Satellite Node Top -->
    <g transform="translate(0, -75)">
      <circle cx="0" cy="0" r="12" fill="#08142b" stroke="#60a5fa" stroke-width="1.2" />
      <circle cx="0" cy="0" r="3.5" fill="#60a5fa" />
      <line x1="0" y1="0" x2="0" y2="28" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="2 2" />
      <text x="0" y="-16" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle" class="mono">RAG CORE</text>
    </g>

    <!-- Subtle Data Sparks -->
    <circle cx="-50" cy="-45" r="1.5" fill="#38bdf8" />
    <circle cx="65" cy="-40" r="1.5" fill="#60a5fa" />
    <circle cx="0" cy="45" r="2" fill="#38bdf8" />
  </g>
</svg>