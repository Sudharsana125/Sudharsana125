<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <!-- Background & Ambient Light -->
    <linearGradient id="hdrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080e1d" />
      <stop offset="100%" stop-color="#060a14" />
    </linearGradient>

    <!-- Subtle Animated Border Gradient -->
    <linearGradient id="animatedBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#38bdf8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#818cf8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Fine Matrix Dots -->
    <pattern id="hdrDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#334155" fill-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="996" height="196" rx="14" fill="url(#hdrBg)" stroke="url(#animatedBorder)" stroke-width="1.6" />
  <rect x="2" y="2" width="996" height="196" rx="14" fill="url(#hdrDots)" />

  <!-- Ambient Backdrop Lights -->
  <circle cx="350" cy="100" r="120" fill="#0284c7" fill-opacity="0.12" filter="url(#ambientBlur)" />
  <circle cx="650" cy="100" r="120" fill="#6366f1" fill-opacity="0.1" filter="url(#ambientBlur)" />

  <!-- CENTERED HERO TYPOGRAPHY -->
  <g transform="translate(500, 95)">
    <!-- Name -->
    <text x="0" y="0" text-anchor="middle" font-size="52" font-weight="900" letter-spacing="2" fill="#ffffff" class="sans">
      SUDHARSANA <tspan fill="#38bdf8">K</tspan>
    </text>

    <!-- Nice to meet you -->
    <text x="0" y="45" text-anchor="middle" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="1" class="sans">
      Nice to meet you 👋
    </text>
  </g>
</svg>
