<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <linearGradient id="cardBorderFacility" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="bldgLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="bldgRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <linearGradient id="bldgTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="316" height="356" rx="14" fill="url(#cardBg)" stroke="url(#cardBorderFacility)" stroke-width="1.5" />

  <!-- Top Controls -->
  <!-- 02 Badge -->
  <rect x="18" y="16" width="34" height="22" rx="6" fill="#0f172a" stroke="#0e7490" stroke-width="1" />
  <text x="35" y="31" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="middle" class="mono">02</text>

  <!-- Arrow Circle Icon -->
  <circle cx="286" cy="27" r="13" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <path d="M282 31L290 23M290 23H284M290 23V29" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Isometric Smart Facility Illustration -->
  <g transform="translate(160, 105)">
    <!-- Ambient Aura -->
    <ellipse cx="0" cy="25" rx="55" ry="25" fill="#06b6d4" fill-opacity="0.18" filter="url(#glowCyan)" />

    <!-- Isometric Ground Platform -->
    <polygon points="0,-12 60,18 0,48 -60,18" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
    <polygon points="-60,18 0,48 0,54 -60,24" fill="#0369a1" fill-opacity="0.6" />
    <polygon points="0,48 60,18 60,24 0,54" fill="#0284c7" fill-opacity="0.4" />

    <!-- Sub-building Left -->
    <g transform="translate(-25, 4)">
      <polygon points="0,-18 16,-10 0,-2 -16,-10" fill="url(#bldgTop)" />
      <polygon points="-16,-10 0,-2 0,16 -16,8" fill="url(#bldgLeft)" />
      <polygon points="0,-2 16,-10 16,8 0,16" fill="url(#bldgRight)" />
      <!-- glowing dots/windows -->
      <circle cx="-8" cy="2" r="1" fill="#67e8f9" />
      <circle cx="-8" cy="7" r="1" fill="#67e8f9" />
      <circle cx="8" cy="-1" r="1" fill="#67e8f9" />
      <circle cx="8" cy="4" r="1" fill="#67e8f9" />
    </g>

    <!-- Sub-building Right -->
    <g transform="translate(25, 4)">
      <polygon points="0,-15 14,-8 0,0 -14,-8" fill="url(#bldgTop)" />
      <polygon points="-14,-8 0,0 0,16 -14,8" fill="url(#bldgLeft)" />
      <polygon points="0,0 14,-8 14,8 0,16" fill="url(#bldgRight)" />
      <circle cx="-7" cy="3" r="1" fill="#67e8f9" />
      <circle cx="7" cy="-1" r="1" fill="#67e8f9" />
    </g>

    <!-- Main High-Rise Smart Tower -->
    <g transform="translate(0, -5)">
      <!-- Roof Top -->
      <polygon points="0,-48 24,-36 0,-24 -24,-36" fill="url(#bldgTop)" stroke="#67e8f9" stroke-width="0.8" />
      <!-- Left Facade -->
      <polygon points="-24,-36 0,-24 0,22 -24,10" fill="url(#bldgLeft)" />
      <!-- Right Facade -->
      <polygon points="0,-24 24,-36 24,10 0,22" fill="url(#bldgRight)" />

      <!-- Glowing Windows Grid (Left) -->
      <g fill="#67e8f9">
        <circle cx="-16" cy="-24" r="1.3" /> <circle cx="-8" cy="-20" r="1.3" />
        <circle cx="-16" cy="-17" r="1.3" /> <circle cx="-8" cy="-13" r="1.3" />
        <circle cx="-16" cy="-10" r="1.3" /> <circle cx="-8" cy="-6" r="1.3" />
        <circle cx="-16" cy="-3" r="1.3" />  <circle cx="-8" cy="1" r="1.3" />
        <circle cx="-16" cy="4" r="1.3" />   <circle cx="-8" cy="8" r="1.3" />
      </g>

      <!-- Glowing Windows Grid (Right) -->
      <g fill="#38bdf8">
        <circle cx="8" cy="-20" r="1.3" /> <circle cx="16" cy="-24" r="1.3" />
        <circle cx="8" cy="-13" r="1.3" /> <circle cx="16" cy="-17" r="1.3" />
        <circle cx="8" cy="-6" r="1.3" />  <circle cx="16" cy="-10" r="1.3" />
        <circle cx="8" cy="1" r="1.3" />   <circle cx="16" cy="-3" r="1.3" />
        <circle cx="8" cy="8" r="1.3" />   <circle cx="16" cy="4" r="1.3" />
      </g>

      <!-- Roof Antenna / Sensor Node -->
      <line x1="0" y1="-48" x2="0" y2="-60" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="0" cy="-60" r="2.5" fill="#22d3ee" filter="url(#glowCyan)" />
    </g>

    <!-- Floating Energy Bolt Badge (Left) -->
    <g transform="translate(-48, -12)">
      <circle cx="0" cy="0" r="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <path d="M1 -7 L-4 0 L0 0 L-1 7 L4 0 L0 0 Z" fill="#38bdf8" />
    </g>

    <!-- Floating Water Droplet Badge (Right) -->
    <g transform="translate(48, -12)">
      <circle cx="0" cy="0" r="11" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" />
      <path d="M0 -6 C2 -3 4 0 4 3 A4 4 0 0 1 -4 3 C-4 0 -2 -3 0 -6 Z" fill="#22d3ee" />
    </g>
  </g>

  <!-- Title -->
  <text x="20" y="196" font-size="18" font-weight="800" fill="#ffffff" class="sans">Smart Facility Management</text>

  <!-- Description -->
  <text x="20" y="222" font-size="12" fill="#94a3b8" class="sans">AI-driven facility management system for</text>
  <text x="20" y="240" font-size="12" fill="#94a3b8" class="sans">monitoring, predicting and optimizing</text>
  <text x="20" y="258" font-size="12" fill="#94a3b8" class="sans">operations in real-time.</text>

  <!-- Tags Row -->
  <g transform="translate(18, 304)">
    <!-- Python -->
    <rect x="0" y="0" width="58" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="29" y="17" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle" class="sans">Python</text>

    <!-- ML -->
    <rect x="64" y="0" width="38" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="83" y="17" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle" class="sans">ML</text>

    <!-- IoT -->
    <rect x="108" y="0" width="40" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="128" y="17" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle" class="sans">IoT</text>

    <!-- Streamlit -->
    <rect x="154" y="0" width="76" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="192" y="17" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle" class="sans">Streamlit</text>
  </g>
</svg>
