<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="100%" height="100%">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#070b16" />
    </linearGradient>

    <linearGradient id="boxBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="headerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="616" height="326" rx="14" fill="url(#stackBg)" stroke="url(#headerBorder)" stroke-width="1.5" />

  <!-- Section Title -->
  <g transform="translate(20, 28)">
    <text x="0" y="0" font-size="16" font-weight="800" fill="#a855f7" class="mono">&lt;/&gt;</text>
    <text x="32" y="0" font-size="16" font-weight="800" fill="#f8fafc" class="sans">Tech Stack</text>
  </g>

  <!-- GRID OF CATEGORIES -->

  <!-- ROW 1 -->
  <!-- 1. Languages (Top Left: x=20, y=48, w=275, h=120) -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="280" height="120" rx="10" fill="#0b1325" stroke="#1e293b" stroke-width="1.2" />
    <text x="14" y="22" font-size="11" font-weight="700" fill="#94a3b8" class="sans">Languages</text>

    <!-- Python -->
    <g transform="translate(18, 36)">
      <!-- Python icon -->
      <g transform="translate(0, 0) scale(1.3)">
        <path d="M7 1c-3.3 0-3 1.4-3 1.4l.003 1.5h3.04v.45H2.8C1.4 4.3 0 5.8 0 7.8c0 2 1.2 2.2 1.2 2.2h.74V8.5c0-1.2 1-2.2 2.2-2.2h5.1c1 0 1.8-.8 1.8-1.8V1.7c0-.7-.9-.7-.9-.7H7zm-1 1a.7.7 0 110 1.4.7.7 0 010-1.4z" fill="#3b82f6" />
        <path d="M7 13c3.3 0 3-1.4 3-1.4l-.003-1.5H6.957v-.45h4.243c1.4 0 2.8-1.5 2.8-3.5 0-2-1.2-2.2-1.2-2.2h-.74v1.5c0 1.2-1 2.2-2.2 2.2H4.7c-1 0-1.8.8-1.8 1.8v3.1c0 .7.9.7.9.7H7zm1-1a.7.7 0 110-1.4.7.7 0 010 1.4z" fill="#facc15" />
      </g>
      <text x="10" y="38" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">Python</text>
    </g>

    <!-- JavaScript -->
    <g transform="translate(85, 36)">
      <!-- JS yellow badge -->
      <rect x="2" y="1" width="20" height="20" rx="3" fill="#facc15" />
      <text x="12" y="16" font-size="11" font-weight="900" fill="#000000" text-anchor="middle" class="mono">JS</text>
      <text x="12" y="38" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">JavaScript</text>
    </g>

    <!-- HTML5 -->
    <g transform="translate(162, 36)">
      <!-- HTML5 badge -->
      <rect x="2" y="1" width="20" height="20" rx="3" fill="#f97316" />
      <text x="12" y="16" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" class="sans">5</text>
      <text x="12" y="38" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">HTML5</text>
    </g>

    <!-- CSS3 -->
    <g transform="translate(230, 36)">
      <!-- CSS3 badge -->
      <rect x="2" y="1" width="20" height="20" rx="3" fill="#0284c7" />
      <text x="12" y="16" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" class="sans">3</text>
      <text x="12" y="38" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">CSS3</text>
    </g>
  </g>

  <!-- 2. AI / ML (Top Right: x=315, y=48, w=285, h=120) -->
  <g transform="translate(315, 48)">
    <rect x="0" y="0" width="285" height="120" rx="10" fill="#0b1325" stroke="#1e293b" stroke-width="1.2" />
    <text x="14" y="22" font-size="11" font-weight="700" fill="#94a3b8" class="sans">AI / ML</text>

    <!-- OpenAI -->
    <g transform="translate(40, 36)">
      <!-- OpenAI spiral icon -->
      <g transform="translate(-10, 0)">
        <circle cx="10" cy="11" r="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
        <circle cx="10" cy="11" r="4" fill="none" stroke="#34d399" stroke-width="1.2" />
      </g>
      <text x="0" y="38" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">OpenAI</text>
    </g>

    <!-- LangChain -->
    <g transform="translate(132, 36)">
      <!-- LangChain link icon -->
      <g transform="translate(-11, 0)">
        <circle cx="6" cy="11" r="5" fill="none" stroke="#22c55e" stroke-width="2" />
        <circle cx="16" cy="11" r="5" fill="none" stroke="#22c55e" stroke-width="2" />
      </g>
      <text x="0" y="38" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">LangChain</text>
    </g>

    <!-- CrewAI -->
    <g transform="translate(225, 36)">
      <!-- CrewAI icon -->
      <g transform="translate(-10, 0)">
        <circle cx="5" cy="8" r="4" fill="#f43f5e" />
        <circle cx="15" cy="8" r="4" fill="#f43f5e" />
        <circle cx="10" cy="15" r="4" fill="#fb7185" />
      </g>
      <text x="0" y="38" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">CrewAI</text>
    </g>
  </g>

  <!-- ROW 2 -->
  <!-- 3. Frontend / Apps (x=20, y=182, w=115, h=130) -->
  <g transform="translate(20, 180)">
    <rect x="0" y="0" width="125" height="135" rx="10" fill="#0b1325" stroke="#1e293b" stroke-width="1.2" />
    <text x="10" y="20" font-size="10.5" font-weight="700" fill="#94a3b8" class="sans">Frontend / Apps</text>

    <!-- React -->
    <g transform="translate(26, 38)">
      <ellipse cx="8" cy="11" rx="9" ry="3.5" fill="none" stroke="#38bdf8" stroke-width="1.2" transform="rotate(30 8 11)" />
      <ellipse cx="8" cy="11" rx="9" ry="3.5" fill="none" stroke="#38bdf8" stroke-width="1.2" transform="rotate(90 8 11)" />
      <ellipse cx="8" cy="11" rx="9" ry="3.5" fill="none" stroke="#38bdf8" stroke-width="1.2" transform="rotate(150 8 11)" />
      <circle cx="8" cy="11" r="1.8" fill="#38bdf8" />
      <text x="8" y="36" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">React</text>
    </g>

    <!-- Streamlit -->
    <g transform="translate(85, 38)">
      <polygon points="8,2 17,19 -1,19" fill="#f43f5e" />
      <polygon points="8,7 13,17 3,17" fill="#fda4af" />
      <text x="8" y="36" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">Streamlit</text>
    </g>
  </g>

  <!-- 4. Databases (x=155, y=180, w=115, h=135) -->
  <g transform="translate(155, 180)">
    <rect x="0" y="0" width="125" height="135" rx="10" fill="#0b1325" stroke="#1e293b" stroke-width="1.2" />
    <text x="10" y="20" font-size="10.5" font-weight="700" fill="#94a3b8" class="sans">Databases</text>

    <!-- PostgreSQL -->
    <g transform="translate(26, 38)">
      <circle cx="8" cy="11" r="9" fill="#0284c7" />
      <text x="8" y="15" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" class="sans">PG</text>
      <text x="8" y="36" font-size="9.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">PostgreSQL</text>
    </g>

    <!-- MongoDB -->
    <g transform="translate(88, 38)">
      <path d="M8 2 C12 7 13 14 8 20 C3 14 4 7 8 2 Z" fill="#22c55e" />
      <line x1="8" y1="4" x2="8" y2="18" stroke="#15803d" stroke-width="0.8" />
      <text x="8" y="36" font-size="9.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">MongoDB</text>
    </g>
  </g>

  <!-- 5. Cloud / DevOps (x=290, y=180, w=105, h=135) -->
  <g transform="translate(290, 180)">
    <rect x="0" y="0" width="115" height="135" rx="10" fill="#0b1325" stroke="#1e293b" stroke-width="1.2" />
    <text x="10" y="20" font-size="10.5" font-weight="700" fill="#94a3b8" class="sans">Cloud / DevOps</text>

    <!-- AWS -->
    <g transform="translate(26, 38)">
      <text x="8" y="10" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" class="sans">aws</text>
      <path d="M1 14 C5 17 11 17 15 14" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
      <text x="8" y="36" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">AWS</text>
    </g>

    <!-- Docker -->
    <g transform="translate(80, 38)">
      <rect x="2" y="9" width="4" height="3" fill="#38bdf8" />
      <rect x="7" y="9" width="4" height="3" fill="#38bdf8" />
      <rect x="7" y="5" width="4" height="3" fill="#38bdf8" />
      <path d="M-1 12 C1 18 16 18 18 13 C17 11 0 11 -1 12 Z" fill="#0284c7" />
      <text x="8" y="36" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">Docker</text>
    </g>
  </g>

  <!-- 6. Tools (x=415, y=180, w=185, h=135) -->
  <g transform="translate(415, 180)">
    <rect x="0" y="0" width="185" height="135" rx="10" fill="#0b1325" stroke="#1e293b" stroke-width="1.2" />
    <text x="10" y="20" font-size="10.5" font-weight="700" fill="#94a3b8" class="sans">Tools</text>

    <!-- Git -->
    <g transform="translate(18, 38)">
      <rect x="0" y="3" width="14" height="14" rx="2" fill="#f97316" transform="rotate(45 7 10)" />
      <circle cx="7" cy="10" r="2" fill="#ffffff" />
      <text x="7" y="36" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">Git</text>
    </g>

    <!-- GitHub -->
    <g transform="translate(52, 38)">
      <circle cx="7" cy="10" r="8" fill="#ffffff" />
      <circle cx="7" cy="10" r="6" fill="#0f172a" />
      <text x="7" y="36" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">GitHub</text>
    </g>

    <!-- VS Code -->
    <g transform="translate(88, 38)">
      <polygon points="3,10 12,3 12,17" fill="#0284c7" />
      <polygon points="12,3 7,7 7,13 12,17" fill="#38bdf8" />
      <text x="8" y="36" font-size="9.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">VS Code</text>
    </g>

    <!-- Notion -->
    <g transform="translate(124, 38)">
      <rect x="1" y="2" width="15" height="16" rx="2" fill="#ffffff" />
      <text x="8" y="15" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" class="sans">N</text>
      <text x="8" y="36" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">Notion</text>
    </g>

    <!-- Figma -->
    <g transform="translate(158, 38)">
      <circle cx="5" cy="5" r="3" fill="#f43f5e" />
      <circle cx="11" cy="5" r="3" fill="#fb923c" />
      <circle cx="5" cy="11" r="3" fill="#a855f7" />
      <circle cx="11" cy="11" r="3" fill="#38bdf8" />
      <circle cx="5" cy="17" r="3" fill="#22c55e" />
      <text x="8" y="36" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle" class="sans">Figma</text>
    </g>
  </g>
</svg>
