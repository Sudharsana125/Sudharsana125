<svg width="100%" height="22" viewBox="0 0 900 22" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="div-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="25%" stop-color="#71717A" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#71717A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="div-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Line -->
  <line x1="50" y1="11" x2="850" y2="11" stroke="url(#div-silver)" stroke-width="1.4" filter="url(#div-glow)" />

  <!-- Center Ambient Glow -->
  <circle cx="450" cy="11" r="10" fill="url(#node-glow)" />

  <!-- Center Diamond & Accents -->
  <polygon points="450,6 455,11 450,16 445,11" fill="#FFFFFF" filter="url(#div-glow)" />
  <circle cx="434" cy="11" r="1.6" fill="#E2E8F0" />
  <circle cx="466" cy="11" r="1.6" fill="#E2E8F0" />
</svg>
